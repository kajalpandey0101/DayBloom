services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daybloom}
      POSTGRES_USER: ${POSTGRES_USER:-daybloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - daybloom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daybloom} -d ${POSTGRES_DB:-daybloom}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daybloom_postgres_data:
